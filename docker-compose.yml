services:
  backend:
    build: ./server
    ports:
      - "127.0.0.1:5001:5000"   # bound to loopback for security
    environment:
      - MONGO_URI=mongodb://mongo:27017/ai-career
    env_file:
      - server/.env
    depends_on:
      - mongo
    restart: always   # auto restart

  frontend:
    build: ./client
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: always

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db   # data persistence
    restart: always

volumes:
  mongo-data:
